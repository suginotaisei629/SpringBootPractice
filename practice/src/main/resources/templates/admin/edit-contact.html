<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせ編集</title>
	<link rel="stylesheet" href="/css/logout-container.css">
</head>
<body>
    <h1>お問い合わせ編集</h1>
	<form th:action="@{/admin/contacts/{id}/edit(id=${contact.id})}" th:object="${contact}" method="post">
    <table border="1">
        <tr>
            <td>姓</td>
			<td>
            <input type="text" th:field="*{lastName}"/>
			</td>
        </tr>
        <tr>
            <td>名</td>
			<td>
            <input type="text" th:field="*{firstName}"/>
			</td>
        </tr>
        <tr>
            <td>メールアドレス</td>
			<td>
            <input type="email" th:field="*{email}"/>
			</td>
        </tr>
        <tr>
            <td>電話番号</td>
			<td>
            <input type="tel" th:field="*{phone}">
			</td>
        </tr>
        <tr>
            <td>郵便番号</td>
			<td>
            <input type="text" th:field="*{zipCode}">
			</td>
        </tr>
        <tr>
            <td>住所</td>
			<td>
            <input type="text" th:field="*{address}">
			</td>
        </tr>
        <tr>
            <td>建物名</td>
			<td>
            <input type="text" th:field="*{buildingName}">
			</td>
        </tr>
        <tr>
			<td>お問い合わせ種別</td>
			<td>
				<select name="contactType">
					<option th:value="services">サービスに関するお問い合わせ</option>
					<option th:value="technicalQuestions">技術的なお問い合わせ</option>
					<option th:value="others">その他</option>
				</select>
				<span th:if="${#fields.hasErrors('contactType')}" th:errors="*{contactType}" style="color: red"></span>
			</td>	        
        </tr>
        <tr>
            <td>内容</td>
			<td>
				<textarea th:field="*{body}" row="4" cols="80"></textarea>
				<span th:if="${#fields.hasErrors('body')}" th:errors="*{body}" style="color: red"></span>
			</td>
        </tr>
		<button type="submit">保存</button>
    </table>
	</form>
	<form th:action="@{/admin/contacts/{{contact.id}}/delete}" method="post" style="display:inline;">
		<input type="hidden" name="_method" value="delete" />
		<button type="submit" style="color:red;">削除</button>
	</form>
	<div class="logout-container">
		<form th:action="@{/admin/logout}" method="post">
			<input type="hidden" name="_csrf" th:value="${_csrf.token}" />
			<input type="submit" value="ログアウト">
		</form>
	</div>
	
</body>
</html>
